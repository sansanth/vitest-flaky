name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      # The test tools (vitest 5, jsdom 30) need Node 22 or newer. On Node 20, which the package supports, the tools run
      # on 24 and the built package is loaded on 20.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node == '20' && '24' || matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        if: matrix.node != '20'
      - run: npm run lint
        if: matrix.node != '20'
      - run: npm run test:coverage
        if: matrix.node != '20'
      - run: npm run build
      - uses: actions/setup-node@v7
        if: matrix.node == '20'
        with:
          node-version: "20"
      - run: node --version
      - run: npm run smoke
      - run: npm pack --dry-run
